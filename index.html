<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ritmo</title>
<meta name="description" content="Ritmo: gezonder leven voor (beginnende) sporters. Gewoontes, voeding, water, training en persoonlijk advies.">
<meta name="theme-color" content="#1F6B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{-webkit-tap-highlight-color:transparent}body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: telefoonframe op desktop, volledig scherm op mobiel; vier tabbladen onder in beeld */
:root{
  --bg:#E9EEE6; --surface:#FBFCF8; --surface-2:#F1F4EC; --ink:#17251D; --muted:#5D6B61;
  --line:#D7DFD2; --accent:#1F6B4A; --accent-soft:#D5EBDD; --sun:#E8A33A; --water:#2F7FB8; --water-soft:#D8E9F5;
  --sleep:#6B5BB0; --sleep-soft:#E4E0F3; --kcal:#C8642E; --kcal-soft:#F6E1D3;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#162019; --surface-2:#1C2820; --ink:#E6EEE7; --muted:#9AAA9F; --line:#2A382F;
  --accent:#5FC293; --accent-soft:#1F3B2C; --sun:#F0B451; --water:#6CB3E6; --water-soft:#1A3142; --sleep:#A397E3; --sleep-soft:#2A2645; --kcal:#EE9662; --kcal-soft:#3A2619; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#162019; --surface-2:#1C2820; --ink:#E6EEE7; --muted:#9AAA9F; --line:#2A382F;
  --accent:#5FC293; --accent-soft:#1F3B2C; --sun:#F0B451; --water:#6CB3E6; --water-soft:#1A3142; --sleep:#A397E3; --sleep-soft:#2A2645; --kcal:#EE9662; --kcal-soft:#3A2619; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;display:flex;justify-content:center;align-items:center}
.shell{display:flex;gap:40px;align-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro{max-width:300px}
.intro h1{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em;margin:0 0 12px}
.intro p{color:var(--muted);margin:0 0 10px}
.intro .tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:99px;margin-bottom:14px}
.phone{width:390px;height:780px;max-height:calc(100vh - 48px);background:var(--surface);border-radius:44px;border:10px solid var(--ink);box-shadow:0 30px 60px -20px rgba(20,40,30,.35);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (max-width:760px){
  body{display:block}
  .shell{display:block;padding:0;height:100%}
  .intro{display:none}
  .phone{width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}
}
.screen{flex:1;overflow-y:auto;padding-block:22px 24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.screen::-webkit-scrollbar{width:0}
header.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.date{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2.hello{font-family:var(--display);font-size:28px;font-weight:700;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--display);border:0;cursor:pointer}
.card{background:var(--surface-2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>*{min-width:0}
.field select,.field input{width:100%}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.score{display:flex;gap:18px;align-items:center;background:var(--ink);color:var(--surface);border-radius:24px;padding:18px}
.score .txt h3{font-family:var(--display);font-size:20px;margin:0 0 4px}
.score .txt p{margin:0;font-size:13px;opacity:.8}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:800}
.glasses{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:6px}
.glass{aspect-ratio:3/4;max-width:100%;border-radius:6px 6px 10px 10px;border:2px solid var(--water);background:transparent;cursor:pointer;padding:0;position:relative;overflow:hidden}
.glass i{position:absolute;left:0;right:0;bottom:0;background:var(--water)}
.glass:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.round{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.moods{display:flex;gap:6px}
.mood{flex:1;font:inherit;font-size:12px;font-weight:600;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.mood b{font-family:var(--display);font-size:18px;color:var(--ink)}
.mood.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.habit{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border-radius:14px;cursor:pointer;border:0;font:inherit;color:var(--ink);text-align:left;width:100%}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:var(--surface)}
.habit.done .check{background:var(--accent);border-color:var(--accent)}
.habit.done span.t{text-decoration:line-through;color:var(--muted)}
.streak{margin-left:auto;font-size:12px;color:var(--sun);font-weight:700;white-space:nowrap}
.addrow{display:flex;gap:8px}
input[type=text],input[type=number],input[type=time],select{font:inherit;flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.sleep{background:var(--sleep-soft)}
.sleep .big{color:var(--sleep)}
.waterc{background:var(--water-soft)}
.kcalc{background:var(--kcal-soft)}
.kcalc .big{color:var(--kcal)}
.kcalc .bar i{background:var(--kcal)}
.meal{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border-radius:14px}
.meal .time{font-size:12px;font-weight:700;color:var(--muted);width:72px;flex:none}
.meal .name{font-weight:600}
.meal .kc{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:color-mix(in srgb,var(--sun) 22%,transparent);color:var(--ink)}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:4px}
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .b{width:100%;background:var(--accent);border-radius:8px 8px 4px 4px;min-height:4px;transition:height .4s}
.chart .col.today .b{background:var(--sun)}
.chart .d{font-size:11px;color:var(--muted);font-weight:600}
.chart .v{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{font:inherit;font-weight:600;font-size:13px;padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.act.on{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg .act{border-radius:12px;padding:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.unit{position:relative;display:flex}
.unit input{padding-right:44px}
.unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.result{background:var(--ink);color:var(--surface);border-radius:20px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.result .label{color:inherit;opacity:.7}
.result .big{color:var(--surface)}
.result .big small{color:inherit;opacity:.7}
.result .full{grid-column:1/-1;font-size:12px;opacity:.75}
details.how{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:13px}
details.how summary{cursor:pointer;font-weight:600}
details.how p{margin:8px 0 0;color:var(--muted)}
details.how code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;border:0;font-family:inherit;color:var(--ink);width:100%;text-align:left}
.switch .k{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch .k::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:.2s}
.switch.on .k{background:var(--water)}
.switch.on .k::after{left:19px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{font:inherit;font-size:11px;font-weight:600;background:none;border:0;padding:10px 0 12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--accent)}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.toggle:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper span{min-width:56px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.advice{background:var(--surface-2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.advice .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.advice .head>div{min-width:0}
.advice .plan{font-size:13px;background:var(--surface);border-radius:12px;padding:10px 12px}
.advice .plan b{color:var(--accent)}
.advice .mine{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec{font-family:var(--display);font-size:20px;font-weight:700;margin:8px 0 0;text-wrap:balance}
.sec-sub{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.tip{background:var(--accent-soft);border-radius:20px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.tip .ic{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;flex:none}
.tip p{margin:4px 0 0;font-size:14px}
.plan{font-size:13px;background:var(--surface);border-radius:12px;padding:10px 12px}
.plan b{color:var(--accent)}
.seg3{grid-template-columns:repeat(3,1fr)}
.act small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:2px}
.macros{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macros div{background:color-mix(in srgb,var(--surface) 12%,transparent);border-radius:12px;padding:10px;min-width:0}
.macros b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.macros span{font-size:11px;opacity:.75}
.goalpill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sun);color:#17251D;padding:3px 9px;border-radius:99px}
.sched{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:14px;padding:12px}
.sched .track{position:relative;height:12px;border-radius:99px;background:var(--line)}
.sched .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--water);transition:width .4s}
.sched .mark{position:absolute;top:-5px;width:3px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.sched .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.status.ok{background:var(--accent-soft);color:var(--accent)}
.status.bijna{background:var(--water-soft);color:var(--water)}
.status.achter{background:color-mix(in srgb,var(--sun) 25%,transparent);color:var(--ink)}
.hrow{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--surface);border-radius:14px}
.checkbtn{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--surface);cursor:pointer;flex:none;padding:0}
.hrow.done .checkbtn{background:var(--accent);border-color:var(--accent)}
.hrow .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hrow .ttl{font-weight:600;min-width:0}
.hrow.done .ttl{color:var(--muted);text-decoration:line-through}
.hrow .meta{font-size:12px;color:var(--muted)}
.hrow details.how{background:var(--surface-2);padding:10px 12px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:16px;height:16px;border-radius:5px;background:var(--line);display:block}
.dots i.on{background:var(--accent)}
.dots i.today{outline:2px solid var(--sun);outline-offset:1px}
.dots span{font-size:11px;color:var(--muted);margin-left:4px}
.miss{font-size:11px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--sun) 25%,transparent);padding:3px 8px;border-radius:99px;align-self:flex-start}
.ident{background:var(--ink);color:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ident textarea{font:inherit;resize:none;padding:10px 12px;border-radius:12px;background:transparent;color:var(--surface);border:1.5px solid color-mix(in srgb,var(--surface) 30%,transparent);font-family:var(--display);font-size:17px;font-weight:700;line-height:1.25}
.ident .label,.ident .note{color:inherit;opacity:.75}
.ident .big small{color:inherit;opacity:.75}
.banner{background:var(--sun);color:#17251D;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.banner .btn{background:#17251D;color:#FBFCF8}
.banner .btn.ghost{background:transparent;color:#17251D;border:1.5px solid #17251D}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
.law{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sentence{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.25;text-wrap:balance}
.sect{background:var(--surface-2);border-radius:20px}
.sect>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:20px}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary>div{min-width:0}
.sect-t{font-family:var(--display);font-size:17px;font-weight:700}
.sect-s{font-size:12px;color:var(--muted);margin-top:2px}
.chev{flex:none;color:var(--muted);transition:transform .2s}
.sect[open]>summary .chev{transform:rotate(180deg)}
.sect-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.sect-b .card,.sect-b .advice{background:var(--surface)}
.sect-b .plan,.sect-b .advice details.how,.sect-b .card .unit input{background:var(--surface-2)}
.sect-b details.how p b{color:var(--ink)}
.more>summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:2px}
.more>summary::-webkit-details-marker{display:none}
.more .chev{transition:transform .2s}
.more[open]>summary .chev{transform:rotate(180deg)}
.more-b{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.waterc .more{border-top:1px solid color-mix(in srgb,var(--water) 25%,transparent);padding-top:10px}
.more.dark{margin-top:8px}
.more.dark>summary{color:inherit;opacity:.85;justify-content:flex-start;text-decoration:underline;text-underline-offset:3px}
.more.dark .more-b{padding-top:6px}
.more.dark p{margin:0;font-size:13px}
.sched-track{position:relative;height:10px;border-radius:99px;background:color-mix(in srgb,var(--water) 18%,var(--surface))}
.sched-track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--water)}
.sched-track .mark{position:absolute;top:-5px;width:3px;height:20px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.waterc .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.scanbtn{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer}
label.btn.ghost{background:transparent}
.nutri{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:#fff;flex:none}
.n-A{background:#038141}.n-B{background:#85BB2F}.n-C{background:#FECB02;color:#17251D}.n-D{background:#EE8100}.n-E{background:#E63E11}
table.nut{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.nut th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
table.nut td{padding:6px 0;border-bottom:1px solid var(--line)}
table.nut td:last-child{text-align:right;font-weight:600}
table.nut tr.sub td:first-child{padding-left:14px;color:var(--muted)}
.unitin{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.unitin span{font-size:12px;color:var(--muted);font-weight:500;width:28px;text-align:left}
input.mini{width:84px;flex:none;padding:6px 8px;text-align:right;border-radius:10px}

{"richting":"2 korte zinnen over de richting die deze persoon op gaat en waarom deze gewoontes daarbij passen","gewoontes":[{"t":"de gewoonte als werkwoordsgroep die past in 'ga ik ...', bv. wandelen of een glas water drinken","stapel":"het bestaande moment waar je het aan koppelt, bv. Na de lunch","waar":"de plek, beginnend met een voorzetsel, bv. rond het kantoor","tijd":"HH:MM","tweeMin":"de versie van 2 minuten","beloning":"iets leuks dat erbij hoort","waarom":"1 zin waarom dit bij de identiteit past"}]}`;

const s70=v=>String(v??'').replace(/\s+/g,' ').trim().slice(0,90);
async function maakPlan(opnieuw){
  const ta=$('#identInput'); const id=(ta&&ta.value.trim())||S.identiteit; S.identiteit=id; aiErr='';
  aiState='loading'; render();
  const sample=await samp;
  if(!sample){S.aiPlan=voorbeeldPlan(id);aiErr='De AI-coach komt in een volgende versie van Ritmo. Dit is alvast een voorbeeldplan op basis van je tekst.';aiState='idle';return render()}
  aiCtl=new AbortController();
  try{
    const opts={signal:aiCtl.signal}; if(opnieuw)opts.cache=false;
    const r=await sample.json(aiPrompt(id),opts);
    const items=(Array.isArray(r&&r.gewoontes)?r.gewoontes:[]).slice(0,4).map(g=>({t:cap(s70(g.t)),stapel:cap(s70(g.stapel)),waar:s70(g.waar),tijd:/^\d{2}:\d{2}$/.test(String(g.tijd))?String(g.tijd):'',tweeMin:cap(s70(g.tweeMin)),beloning:cap(s70(g.beloning)),waarom:String(g.waarom??'').trim().slice(0,200)})).filter(g=>g.t);
    if(!items.length)throw {code:'empty_completion'};
    S.aiPlan={richting:String(r.richting??'').trim().slice(0,400),items,bron:'ai',voor:id};
  }catch(e){
    const c=e&&e.code;
    if(c==='cancelled'){}
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){S.aiPlan=voorbeeldPlan(id);aiErr='Je hebt de app geen toegang tot Claude gegeven, dus dit is een voorbeeldplan op basis van je tekst.'}
    else if(c==='rate_limited')aiErr='Je hebt even te vaak gevraagd. Probeer het over een paar minuten opnieuw.';
    else if(c==='refused')aiErr='Hier kan Claude geen plan voor maken. Probeer een andere omschrijving van wie je wilt worden.';
    else aiErr='Het plan maken lukte niet. Probeer het nog een keer.';
  }
  aiCtl=null; aiState='idle'; render();
}

/* ---------- Berekeningen ---------- */
// Ruststofwisseling (BMR) volgens Mifflin-St Jeor
function bmr(p){return 10*p.gewicht+6.25*p.lengte-5*p.leeftijd+(p.geslacht==='man'?5:-161)}
// Dagbehoefte om op gewicht te blijven = BMR x activiteitsfactor
function kcalDoel(p){return Math.round(bmr(p)*ACT[p.activiteit].f/10)*10}
// Drinkadvies: EFSA-basis uit dranken (man 2,0 l, vrouw 1,6 l) + extra voor sport + extra bij warm weer of training vandaag
function waterBasis(p){return p.geslacht==='man'?2000:1600}
function waterDoel(){const p=S.profiel;return waterBasis(p)+ACT[p.activiteit].w+(S.warm?500:0)}
// Drinkschema: doel gelijk verdeeld van opstaan tot 1 uur voor bedtijd (doordeweeks en weekend apart), op basis van de klok van de telefoon
const minNu=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`};
const tm=s=>{const[h,mi]=String(s||'0:0').split(':').map(Number);return (h||0)*60+(mi||0)};
const isWeekend=()=>[0,6].includes(new Date().getDay());
const dagKey=()=>new Date().toDateString();
function drinkVenster(){
  const soort=isWeekend()?'weekend':'werk', r=S.ritme[soort];
  const op=tm(r.op); let bed=tm(r.bed); if(bed<=op)bed+=1440;
  const aangepast=!!(S.startVandaag&&S.startVandaag.d===dagKey());
  const s=aangepast?S.startVandaag.m:op; let e=bed-60; if(e<s+120)e=s+120;
  let m=minNu(); if(e>=1440&&m<s&&m+1440<=e+60)m+=1440;
  return {s,e,m,soort,aangepast,op};
}
function waterNu(){const V=drinkVenster(),f=Math.max(0,Math.min(1,(V.m-V.s)/(V.e-V.s)));return Math.round(waterDoel()*f/50)*50}
function waterSchema(){
  const V=drinkVenster(), DRINK_START=V.s, DRINK_EIND=V.e;
  const wd=waterDoel(), nu=waterNu(), m=V.m, diff=S.waterMl-nu;
  let status,klasse,tekst;
  if(m<DRINK_START){status='Nog niet begonnen';klasse='bijna';tekst=`Je drinkschema begint om ${hhmm(DRINK_START)}. Start de dag met een glas water.`}
  else if(S.waterMl>=wd){status='Doel gehaald';klasse='ok';tekst='Je hebt je water voor vandaag binnen. Drink gerust bij als je dorst hebt.'}
  else if(diff>=0){status='Op schema';klasse='ok';tekst=diff>=S.glasMl?`Je ligt ${nl(diff)} ml voor op schema.`:'Je zit precies goed.'}
  else if(-diff<=S.glasMl){status='Bijna op schema';klasse='bijna';tekst=`Nog ${nl(-diff)} ml, dat is minder dan 1 glas, om weer op schema te komen.`}
  else{const gl=Math.ceil(-diff/S.glasMl);status='Achter op schema';klasse='achter';tekst=`Je loopt ${nl(-diff)} ml achter. Drink de komende uren ${gl} ${gl===1?'glas':'glazen'} extra om bij te komen.`}
  // Wanneer is het volgende glas gepland?
  const volgendMl=S.waterMl+S.glasMl, tVolg=DRINK_START+(volgendMl/wd)*(DRINK_EIND-DRINK_START);
  const volgend=S.waterMl>=wd?null:(tVolg<=m?'nu':hhmm(Math.min(tVolg,DRINK_EIND)));
  return {wd,nu,m,status,klasse,tekst,volgend,V};
}

/* ---------- Doel: afvallen, fitter worden, spiermassa ---------- */
const DOEL={afvallen:{l:'Afvallen',s:'Vet verliezen'},fit:{l:'Fitter',s:'Op gewicht blijven'},spier:{l:'Spiermassa',s:'Met krachttraining'}};
const TEMPO={rustig:{l:'Rustig',s:'−300 kcal · ca. 0,3 kg per week',d:300},normaal:{l:'Normaal',s:'−500 kcal · ca. 0,5 kg per week',d:500}};
const bmi=p=>p.gewicht/((p.lengte/100)**2);
function plan(p){
  const tdee=kcalDoel(p), rust=Math.round(bmr(p)), B=bmi(p);
  const blok=p.doel==='afvallen'&&B<18.5, doel=blok?'fit':p.doel;
  // Bij BMI 30+ rekenen we eiwit met het gewicht bij BMI 25, anders valt het advies te hoog uit
  const refKg=B>=30?25*(p.lengte/100)**2:p.gewicht;
  let kcal=tdee, ek=[1.2,1.6], vetPct=.30, kgWeek=0, weken=null, ondergrens=false;
  const streefBmi=p.streef/((p.lengte/100)**2), streefLaag=doel==='afvallen'&&streefBmi<18.5;
  if(doel==='afvallen'){
    const min=Math.max(rust,p.geslacht==='man'?1500:1200);
    kcal=tdee-TEMPO[p.tempo].d; if(kcal<min){kcal=min;ondergrens=true}
    kgWeek=(tdee-kcal)*7/7700; ek=[1.6,2.0]; vetPct=.25;
    if(!streefLaag&&p.streef<p.gewicht&&kgWeek>0)weken=Math.ceil((p.gewicht-p.streef)/kgWeek);
  }
  // Spiermassa: alleen een overschot als je ook traint. Zittend + overschot = vooral vet erbij.
  const geenTraining=doel==='spier'&&p.activiteit==='zittend';
  if(doel==='spier'&&!geenTraining){kcal=tdee+300;kgWeek=.25;ek=[1.6,2.2];vetPct=.25}
  kcal=Math.round(kcal/10)*10;
  const eiwit=Math.round(refKg*(ek[0]+ek[1])/2), vet=Math.round(kcal*vetPct/9), kh=Math.max(0,Math.round((kcal-eiwit*4-vet*9)/4));
  return {doel,blok,tdee,rust,kcal,ek,refKg,eiwit,vet,kh,vetPct,kgWeek,weken,ondergrens,streefLaag,bmi:B,geenTraining};
}

/* ---------- Advies op basis van profiel ---------- */
// Stappen: einddoel 7.000 (Lancet Public Health 2025), opbouw +1.000 per week vanaf huidig gemiddelde
// Bewegen: einddoel 150 min/week (Beweegrichtlijnen Gezondheidsraad), opbouw +20 min per week
// Slaap: 7 tot 9 uur (65+: 7 tot 8 uur); groente 250 g (Schijf van Vijf); eiwit 0,8 g/kg, sporters 1,2 tot 1,6 g/kg
function advies(){
  const p=S.profiel, ST=7000, BW=150;
  const stKlaar=p.stappenNu>=ST, bwKlaar=p.beweegNu>=BW;
  return {
    stappen:{doel:stKlaar?Math.round(p.stappenNu/500)*500:Math.min(ST,Math.ceil((p.stappenNu+1000)/500)*500),eind:ST,weken:stKlaar?0:Math.ceil((ST-p.stappenNu)/1000),klaar:stKlaar},
    beweegWeek:{doel:bwKlaar?Math.round(p.beweegNu/10)*10:Math.min(BW,Math.ceil((p.beweegNu+20)/10)*10),eind:BW,weken:bwKlaar?0:Math.ceil((BW-p.beweegNu)/20),klaar:bwKlaar},
    slaap:{doel:p.leeftijd>=65?7.5:8,range:p.leeftijd>=65?'7 tot 8':'7 tot 9'},
    groente:{doel:250},
    eiwit:{basis:Math.round(p.gewicht*0.8),laag:Math.round(p.gewicht*1.2),hoog:Math.round(p.gewicht*1.6),sport:p.activiteit!=='zittend'}
  };
}
function tipVandaag(){
  const h=new Date().getHours(), verwacht=waterNu(), g=som('groente');
  if(S.waterMl<verwacht-S.glasMl)return `Je zit op ${liter(S.waterMl)} liter water. Rond deze tijd is ${liter(verwacht)} liter een goed tempo. Zet een glas naast je neer, dan vergeet je het minder snel.`;
  if(h>=12&&S.stappen<S.doelen.stappen*0.6)return `Nog ${nl(S.doelen.stappen-S.stappen)} stappen tot je doel. Een wandeling van 15 minuten levert ongeveer 1.500 stappen op.`;
  if(h>=14&&g<150)return `Je zit op ${g} gram groente. Schep vanavond de helft van je bord vol groente, dan kom je dicht bij de 250 gram.`;
  if(S.slaap<S.doelen.slaap-1)return `Je sliep korter dan je doel. Ga vanavond een half uur eerder naar bed. Na een korte nacht herstelt je lichaam minder goed van sporten.`;
  return 'Je ligt goed op schema. Kies vandaag één gewoonte uit je lijst en maak die zeker af. Kleine stappen die je volhoudt werken beter dan grote sprongen.';
}

function parseTijd(t){t=String(t||'').trim().replace(/[.,]/g,':');if(!t)return null;const p=t.split(':').map(Number);if(p.some(x=>!isFinite(x)||x<0))return null;
  if(p.length===1)return p[0]*60; if(p.length===2)return p[0]*60+p[1]; if(p.length===3)return p[0]*3600+p[1]*60+p[2]; return null}
const fmtTijd=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`};
function tempoVan(type,sp){const c=SPORT[type];if(!c||!c.tempo||!sp)return null;const a=getal(sp.afstand),t=parseTijd(sp.tijd);if(!a||!t)return null;
  if(c.tempo==='100m')return {v:t/(a/100),txt:`${fmtTijd(t/(a/100))} /100 m`,sneller:'laag'};
  if(c.tempo==='km')return {v:t/a,txt:`${fmtTijd(t/a)} /km`,sneller:'laag'};
  return {v:a/(t/3600),txt:`${n1(a/(t/3600))} km/u`,sneller:'hoog'}}
const woTitel=w=>w.type==='Overig'&&w.sport&&w.sport.naam?w.sport.naam:w.type;
function sportSam(w){const c=SPORT[w.type],sp=w.sport||{};if(!c)return '';const d=[];
  const a=getal(sp.afstand);if(a&&c.afstand)d.push(c.afstand==='m'?`${nl(a)} m`:`${n1(a)} km`);
  if(sp.tijd&&parseTijd(sp.tijd))d.push(fmtTijd(parseTijd(sp.tijd)));
  const tp=tempoVan(w.type,sp);if(tp)d.push(tp.txt);
  (c.kies||[]).forEach(([k])=>{if(sp[k])d.push(sp[k].toLowerCase())});
  (c.tellers||[]).forEach(([k,l])=>{if(sp[k])d.push(`${sp[k]} ${sp[k]===1?{goals:'doelpunt',assists:'assist'}[k]:l.toLowerCase()}`)});
  return d.join(' · ')}
function sportVelden(w){

      ${c.tijd?`<div class="field"><label for="sp-tijd">Tijd</label><input type="text" id="sp-tijd" data-sport="tijd" value="${esc(sp.tijd||'')}" inputmode="numeric" autocomplete="off" placeholder="mm:ss"></div>`:''}
    </div>`:''}

    ${(c.kies||[]).map(([k,l,opts])=>`<div class="field"><label>${l}</label><div class="acts">${opts.map(o=>`<button type="button" class="act ${sp[k]===o?'on':''}" data-sportkies="${k}|${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`).join('')}

function sportRecords(behalveId){
  const W=(S.workouts||[]).filter(w=>w.id!==behalveId), out={};
  ['Hardlopen','Zwemmen','Fietsen','Wandelen'].forEach(t=>{const c=SPORT[t];const ws=W.filter(w=>w.type===t&&getal((w.sport||{}).afstand));

        </div>`}).join('')}

}
function bewaarWorkout(){
  const w=wo;
  w.min=Math.round(+w.min||0);if(w.min<=0)return toast('Vul in hoe lang je hebt getraind');
  const sc=SPORT[w.type];w.sport=w.sport||{};
  if(sc){const t=parseTijd(w.sport.tijd);if(sc.tijd&&w.sport.tijd&&!t)return toast('Vul de tijd in als mm:ss, bijvoorbeeld 27:30');if(t)w.sport.tijd=fmtTijd(t);}
  const srVoor=sportRecords(w.id);
  if(w.type==='Krachttraining'){w.oef=w.oef.map(o=>({...o,naam:cap(String(o.naam||'').trim())||'Oefening',sets:o.sets.filter(s=>(+s.r||0)>0).map(s=>({r:+s.r,kg:+s.kg||0}))})).filter(o=>o.sets.length)}else w.oef=[];
  // Records bepalen tegen alle eerdere workouts
  const recs=[];w.oef.forEach(o=>{const b=besteVan(o.naam,w.id),kg=Math.max(...o.sets.map(s=>s.kg)),r=Math.max(...o.sets.map(s=>s.r));const eerder=vorigeOef(o.naam,w.id);if(!eerder)return;
    if(kg>0&&kg>b.kg)recs.push(`${o.naam} ${n1(kg)} kg`);else if(kg===0&&b.kg===0&&r>b.r)recs.push(`${o.naam} ${r}${o.eenheid==='sec'?' sec':' herhalingen'}`)});
  const {bewerk,...rec}=w;const srNa=(()=>{const old=S.workouts;S.workouts=old.filter(x=>x.id!==w.id).concat([rec]);const r=sportRecords();S.workouts=old;return r})();
  Object.keys(srNa).forEach(k=>{if(!k.startsWith(w.type+'|'))return;const a=srVoor[k],b=srNa[k];if(!a)return;const beter=k.endsWith('tempo')?(b.sneller==='laag'?b.v<a.v:b.v>a.v):b.v>a.v;if(beter)recs.push(`${b.label.toLowerCase()}: ${b.txt}`)});
  S.workouts=(S.workouts||[]).filter(x=>x.id!==w.id).concat([rec]);
  wo=null;render();screen.scrollTop=0;
  if(bewerk)return toast('Workout bijgewerkt');
  vier({titel:recs.length?'Nieuw record!':'Workout gelogd!',sub:recs.length?esc(cap(recs.join(', '))):`${esc(woTitel(w))} · ${esc(sportSam(w)||w.min+' minuten')}. Elke training telt.`,xp:20,groot:recs.length>0});
}

         ['Waarom niet meteen 7.000?',`Je zet nu ongeveer ${nl(p.stappenNu)} stappen. Wie te snel te veel wil, haakt vaak af of krijgt last van voeten en knieën. 1.000 stappen erbij is ongeveer 10 minuten extra wandelen.`],

      ${advBlok('beweegWeek','Sporten per week',10,'min',A.beweegWeek.doel,

      ${advBlok('slaap','Slaap per nacht',.5,'uur',A.slaap.doel,`Advies voor jouw leeftijd: ${A.slaap.range} uur`,'',
        [['Hoeveel slaap heb ik nodig?',`Voor volwassenen${p.leeftijd>=65?' vanaf 65 jaar':''} is ${A.slaap.range} uur het advies. Ga je sporten, dan heb je die slaap extra nodig om te herstellen.`],

function dagFractie(key){const n=S.gewoontes.length,h=S.gewoontes.filter(x=>x.log[key]).length,g=(S.doelLog||{})[key]||{},gd=DOELEN3.filter(([k])=>g[k]).length;return {h,n,gd,s:(h+gd)/((n+3)||1)}}

function xpInfo(){

  Object.values(S.doelLog||{}).forEach(g=>DOELEN3.forEach(([k])=>{if(g[k])xp+=15}));
  const dagen=new Set();S.gewoontes.forEach(h=>Object.keys(h.log).forEach(d=>dagen.add(d)));

async function verklein(file,max=1600){
  const bmp=await createImageBitmap(file);const f=Math.min(1,max/Math.max(bmp.width,bmp.height));
  // Witte rand eromheen: barcodes hebben een lege marge nodig om gelezen te worden
  const w=Math.round(bmp.width*f),h=Math.round(bmp.height*f),m=Math.round(Math.max(w,h)*0.08);
  const c=document.createElement('canvas');c.width=w+2*m;c.height=h+2*m;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,m,m,w,h);return c;
}

function zoekCode(code){
  const c=String(code).replace(/\D/g,'');

  const eigen=S.mijnProducten&&(S.mijnProducten[c]||S.mijnProducten[c.padStart(13,'0')]);

  if(d.act==='recannul'){recForm=null;return render()}
  if(d.act==='recsave'&&recForm){const F=recForm,v=getal(F.waarde);
    if(!v)return toast('Vul eerst je record in');if(F.date>dk(0))return toast('Kies een datum van vandaag of eerder');
    const voor=recDetail(F.naam),cur=F.eenheid==='kg'?voor.kg:voor.r,nieuw=v>cur;
    S.records.handmatig.push({id:'r'+Date.now(),naam:F.naam,waarde:v,eenheid:F.eenheid,date:F.date||dk(0)});
    if(!S.records.lijst.includes(F.naam))S.records.lijst.push(F.naam);
    recForm=null;render();
    const txt=`${esc(F.naam)}: ${F.eenheid==='kg'?n1(v)+' kg':v+(F.eenheid==='sec'?' seconden':' herhalingen')}`;
    vier({titel:nieuw?'Nieuw record!':'Record gelogd',sub:nieuw?txt+(cur?` (was ${F.eenheid==='kg'?n1(cur)+' kg':cur})`:''):txt+'. Je beste blijft staan.',xp:10,groot:nieuw});return}
  if(d.rsel){resetSel[d.rsel]=!resetSel[d.rsel];return render()}
  if(d.reset)return doReset([d.reset]);
  if(d.act==='resetnu')return doReset(Object.keys(resetSel).filter(k=>resetSel[k]));
  if(d.act==='undo'&&lastReset){S=JSON.parse(lastReset.snap);lastReset=null;toast('Teruggezet');return render()}
  if(d.act==='nieuwedagok'){nieuweDagMelding=false;return render()}
  if(d.aiadd!==undefined&&S.aiPlan){const [it]=S.aiPlan.items.splice(+d.aiadd,1);if(it){voegToe(it);toast(`"${it.t}" toegevoegd`)}if(!S.aiPlan.items.length)S.aiPlan=null;return render()}
  if(d.aiskip!==undefined&&S.aiPlan){S.aiPlan.items.splice(+d.aiskip,1);if(!S.aiPlan.items.length)S.aiPlan=null;return render()}
  if(d.act==='aimaak'){if(aiState!=='loading')maakPlan(false);return}
  if(d.act==='aiopnieuw'){if(aiState!=='loading')maakPlan(true);return}
  if(d.act==='aistop'){if(aiCtl)aiCtl.abort();return}
  if(d.act==='aialles'&&S.aiPlan){const n=S.aiPlan.items.length;S.aiPlan.items.forEach(voegToe);S.aiPlan=null;toast(`${n} gewoontes toegevoegd`);return render()}
  if(d.act&&d.act.startsWith('wiz')){
    if(d.act==='wizstart')wiz={step:0,d:{t:'',stapel:'',waar:'',tijd:'',tweeMin:'',beloning:'',herinnering:true}};
    else if(d.act==='wizcancel')wiz=null;
    else if(d.act==='wizprev')wiz.step--;
    else if(d.act==='wizherinner')wiz.d.herinnering=!wiz.d.herinnering;
    else if(d.act==='wiznext'){
      if(wiz.step===0&&!wiz.d.t.trim())return toast('Vul eerst een gewoonte in');
      if(wiz.step===1&&!wiz.d.stapel.trim()&&!wiz.d.tijd)return toast('Kies een moment of een tijd');
      wiz.step++;
    }
    else if(d.act==='wizsave'){
      const w=wiz.d;
      S.gewoontes.push({id:'h'+Date.now(),t:cap(w.t.trim()),stapel:w.stapel.trim(),waar:w.waar.trim(),tijd:w.tijd,tweeMin:cap(w.tweeMin.trim())||cap(w.t.trim()),beloning:cap(w.beloning.trim())||'Afvinken en mijn reeks zien groeien',herinnering:!!(w.herinnering&&w.tijd),log:{}});
      wiz=null;toast('Gewoonte opgeslagen');
    }
    render();screen.scrollTop=0;return;
  }
  if(d.delmeal!==undefined){S.maaltijden.splice(+d.delmeal,1);toast('Maaltijd verwijderd');return render()}
  if(d.g!==undefined){gSel=+d.g;b.parentNode.querySelectorAll('.act').forEach(x=>x.classList.toggle('on',x===b));return}
  if(d.f!==undefined){fSel=+d.f;b.parentNode.querySelectorAll('.act').forEach(x=>x.classList.toggle('on',x===b));return}
  if(d.sex){S.profiel.geslacht=d.sex;toast('Behoefte opnieuw berekend');return render()}
  if(d.glasml){S.glasMl=+d.glasml;toast(`Glasmaat: ${d.glasml} ml`);return render()}
  if(d.actPick){S.activiteit=d.actPick;S._min=+d.min;return render()}
  if(d.doel){const k=d.doel,v=+(S.doelen[k]+(+d.d)).toFixed(1);if(v>0)S.doelen[k]=v;return render()}
  if(d.melding){S.meldingen[d.melding]=!S.meldingen[d.melding];return render()}
  if(d.doelkeuze){S.profiel.doel=d.doelkeuze;openSet.add('doel');toast(d.doelkeuze==='spier'&&S.profiel.activiteit==='zittend'?'Let op: spiermassa vraagt krachttraining':`Doel: ${DOEL[d.doelkeuze].l}`);return render()}
  if(d.act==='gatrainen'){S.profiel.activiteit='matig';toast('Activiteit: gemiddeld actief. Overschot berekend.');return render()}
  if(d.tempo){S.profiel.tempo=d.tempo;toast('Tempo aangepast');return render()}
  if(d.adopt){S.doelen[d.adopt]=+d.v;toast('Advies overgenomen');return render()}
  if(d.act==='adoptall'){const A=advies();['stappen','beweegWeek','slaap','groente'].forEach(k=>S.doelen[k]=A[k].doel);toast('Alle adviezen overgenomen');return render()}
  const voor=S.waterMl;
  switch(d.act){
    case 'water+':S.waterMl+=S.glasMl;checkWaterDoel(voor);break;
    case 'water-':S.waterMl=Math.max(0,S.waterMl-S.glasMl);break;
    case 'startnu':S.startVandaag={d:dagKey(),m:minNu()};toast(`Drinkschema start vandaag om ${hhmm(minNu())}`);break;
    case 'startreset':S.startVandaag=null;toast('Normale opstaantijd teruggezet');break;
    case 'warm':S.warm=!S.warm;toast(S.warm?'Waterdoel +500 ml':'Waterdoel terug naar normaal');break;
    case 'stappen':S.stappen+=1000;break;
    case 'slaap+':S.slaap=Math.min(12,S.slaap+.25);break;
    case 'slaap-':S.slaap=Math.max(0,S.slaap-.25);break;
    case 'min+':S._min=Math.min(240,S._min+5);break;
    case 'min-':S._min=Math.max(5,S._min-5);break;
    case 'logact':if(!S.activiteit)return toast('Kies eerst een activiteit');S.week[vandaagIdx]+=S._min;toast(`${S._min} min ${S.activiteit.toLowerCase()} gelogd`);S.activiteit=null;break;
    case 'reset':S=defaults();toast('Voorbeelddata hersteld');break;
    default:return;
  }
  render();
});

screen.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='recAddForm'){const n=cap($('#recAddNaam').value.trim());if(!n)return;if(!S.records.lijst.includes(n))S.records.lijst.push(n);openRecForm(n);return}
  if(e.target.id==='oefForm'&&wo){const n=$('#oefNaam').value.trim();if(!n)return;wo.oef.push(oefVan(cap(n),'herh',[{r:10,kg:0},{r:10,kg:0},{r:10,kg:0}]));render();return}
  if(e.target.id==='codeForm'){zoekCode($('#codeInput').value);return}
  if(e.target.id==='habitForm'){const v=$('#habitInput').value.trim();if(!v)return;S.gewoontes.push({t:v,done:false,streak:0});toast('Gewoonte toegevoegd');render()}
  if(e.target.id==='mealForm'){const n=$('#mealName').value.trim();if(!n)return;
    S.maaltijden.push({type:$('#mealType').value,naam:n,kcal:Math.max(0,Math.min(3000,+$('#mealKcal').value||0)),eiwit:Math.max(0,Math.min(200,+$('#mealEiwit').value||0)),groente:gSel,fruit:fSel});
    toast('Maaltijd opgeslagen');gSel=100;fSel=0;render()}
});
screen.addEventListener('toggle',e=>{const k=e.target&&e.target.dataset&&e.target.dataset.keep;if(k){if(e.target.open)openSet.add(k);else openSet.delete(k)}},true);
screen.addEventListener('pointermove',e=>{
  const svg=e.target.closest&&e.target.closest('#groeiSvg');if(!svg||!window._groei)return;
  const G=window._groei,rc=svg.getBoundingClientRect(),vx=(e.clientX-rc.left)/rc.width*G.W;
  let i=Math.round((vx-G.xs(0))/(G.xs(1)-G.xs(0)));i=Math.max(0,Math.min(59,i));
  const gx=svg.querySelector('#gx');gx.setAttribute('x1',G.xs(i));gx.setAttribute('x2',G.xs(i));gx.setAttribute('opacity','.6');
  const tip=$('#gtip');let txt;
  if(i<30){const d=G.R[i];txt=`<b>${d.o===0?'Vandaag':datumKort(d.k)}</b> · index ${Math.round(d.idx)}<br>${d.h} van ${d.n} gewoontes, ${d.gd} van 3 dagdoelen`}
  else txt=`<b>Over ${i-29} ${i-29===1?'dag':'dagen'}</b><br>${Math.round(G.proj[i-30])} als je elke dag alles doet`;
  tip.innerHTML=txt;tip.hidden=false;const px=G.xs(i)/G.W*rc.width;tip.style.left=Math.max(4,Math.min(rc.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
});
screen.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('#groeiSvg')&&!e.relatedTarget?.closest?.('#groeiSvg')){const t=$('#gtip');if(t)t.hidden=true;const gx=$('#gx');if(gx)gx.setAttribute('opacity','0')}});
screen.addEventListener('input',e=>{const t=e.target;if(wo&&t.dataset.sport){const k=t.dataset.sport;wo.sport[k]=t.value;if(k==='tijd'){const x=parseTijd(t.value);if(x){wo.min=Math.max(1,Math.ceil(x/60));const m=$('#wo-min');if(m)m.value=wo.min}}const el=$('#wo-tempo');if(el){const tp=tempoVan(wo.type,wo.sport);el.innerHTML=tp?`Je tempo: <b>${tp.txt}</b>`:'Vul afstand en tijd in, dan rekent de app je tempo uit.'}return}if(wo&&t.dataset.wo){wo[t.dataset.wo]=t.dataset.wo==='min'?(getal(t.value)||0):t.value;return}if(recForm&&t.dataset.rec){const k=t.dataset.rec;recForm[k]=t.value;if(k==='naam'){const dd=recDetail(t.value);recForm.eenheid=dd.kg||oefInfo(t.value)[2]?'kg':dd.eh;render()}else if(k==='eenheid')render();return}if(wo&&t.dataset.oef){const[oi,k]=t.dataset.oef.split('.');if(wo.oef[+oi]){wo.oef[+oi][k]=t.value;if(k==='eenheid')render()}return}if(wo&&t.dataset.set){const[oi,si,k]=t.dataset.set.split('.');const st=wo.oef[+oi]&&wo.oef[+oi].sets[+si];if(st)st[k]=getal(t.value)||0;return}if(t.dataset.sp&&scan.product){const k=t.dataset.sp;scan.product[k]=(k==='naam'||k==='merk'||k==='per')?t.value:getal(t.value);if(k==='per')return render();const el=$('#scanTot');if(el)el.innerHTML=scanTotaal();return}if(t.id==='scanPortie'&&scan.product){scan.portie=getal(t.value)||0;const el=$('#scanTot');if(el)el.innerHTML=scanTotaal();return}if(t.id==='scanType'){scan.type=t.value}if(t.dataset.w&&wiz)wiz.d[t.dataset.w]=t.value;
  if(t.dataset.ai&&S.aiPlan){const[i,k]=t.dataset.ai.split('.');if(S.aiPlan.items[+i]){S.aiPlan.items[+i][k]=t.value;save()}}});
screen.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='restoreFile'){const f=t.files&&t.files[0];t.value='';if(!f)return;f.text().then(txt=>{const o=JSON.parse(txt);if(!o||!Array.isArray(o.gewoontes)||!o.profiel)throw 0;S=Object.assign(defaults(),o);save();toast('Back-up teruggezet');render()}).catch(()=>toast('Dit bestand is geen geldige Ritmo-back-up'));return}
  if(t.id==='scanBarcode'){const f=t.files&&t.files[0];t.value='';return scanBarcodeFoto(f)}
  if(t.id==='scanLabel'){const f=t.files&&t.files[0];t.value='';return scanEtiketFoto(f)}
  if(t.id==='scanType'){scan.type=t.value;return}
  if(t.id==='scanPortie'||t.dataset.sp||t.dataset.wo||t.dataset.set||t.dataset.oef||t.dataset.rec||t.dataset.sport)return;
  if(t.dataset.w||t.dataset.ai)return;
  if(t.id==='identInput'){S.identiteit=t.value.trim()||defaults().identiteit;save();toast('Identiteit opgeslagen');return}
  if(t.id==='naamInput'){S.naam=t.value.trim()||'Jij';save();toast('Naam opgeslagen');return}
  if(t.dataset.ritme){const[k,veld]=t.dataset.ritme.split('.');if(!t.value)return render();S.ritme[k][veld]=t.value;toast('Dagritme opgeslagen');return render()}
  if(t.id==='p-act'){S.profiel.activiteit=t.value;toast('Behoefte opnieuw berekend');return render()}
  if(t.dataset.p){
    const min=+t.min,max=+t.max;let v=parseFloat(String(t.value).replace(',','.'));
    if(isNaN(v)){toast('Vul een getal in');return render()}
    if(v<min||v>max){toast(`Kies een waarde tussen ${min} en ${max}`);v=Math.max(min,Math.min(max,v))}
    S.profiel[t.dataset.p]=v;toast('Behoefte opnieuw berekend');render();
  }
});

render();
// Elke minuut het schema bijwerken, behalve als iemand aan het typen is
setInterval(()=>{const a=document.activeElement;if((tab==='vandaag'||tab==='gewoontes'&&!wiz)&&!(a&&a.matches('input,select')))render()},30000);
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){try{toast('Nieuwe versie van Ritmo geladen')}catch(e){}}})})}).catch(()=>{})})}
</script>
